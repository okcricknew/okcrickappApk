name: Build OK CRICK APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android splash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Pull-to-Refresh dependency — existing logic preserved
          gradle = Path("android/app/build.gradle")
          if gradle.exists():
              s = gradle.read_text()
              if "swiperefreshlayout" not in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'",
                      1
                  )
                  gradle.write_text(s)

          # Existing repository icon
          icon = Path("resources/icon.png")
          if not icon.exists():
              raise SystemExit("ERROR: resources/icon.png not found")

          drawable = Path("android/app/src/main/res/drawable-nodpi")
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "startup_icon.png").write_bytes(icon.read_bytes())

          # Native startup background — prevents initial white flash
          bg = Path(
              "android/app/src/main/res/drawable/startup_background.xml"
          )
          bg.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white"/>
              <item
                  android:width="240dp"
                  android:height="240dp"
                  android:gravity="center">
                  <bitmap
                      android:src="@drawable/startup_icon"
                      android:gravity="fill"/>
              </item>
          </layer-list>
          """)

          # Android theme background
          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)

          for f in values.glob("*.xml"):
              s = f.read_text()
              if "AppTheme" in s and "startup_background" not in s:
                  s = s.replace(
                      "</style>",
                      '    <item name="android:windowBackground">@drawable/startup_background</item>\n</style>',
                      1
                  )
                  f.write_text(s)

          # MainActivity
          java = list(
              Path("android/app/src/main/java").rglob("MainActivity.java")
          )

          if not java:
              raise SystemExit("ERROR: MainActivity.java not found")

          f = java[0]
          s = f.read_text()

          # Handler import
          if "import android.os.Handler;" not in s:
              s = s.replace(
                  "import android.os.Bundle;",
                  "import android.os.Bundle;\n          import android.os.Handler;"
              )

          # 5-second splash constant + timer
          if "STARTUP_SPLASH_DURATION" not in s:
              s = s.replace(
                  "private View startupOverlay;",
                  """private View startupOverlay;

              private static final long STARTUP_SPLASH_DURATION = 5000L;

              private final Handler startupHandler = new Handler();

              private final Runnable hideStartupRunnable = () -> hideStartupIcon();"""
              )

          # IMPORTANT:
          # Remove old "hide on first WebView draw" block.
          start = s.find(
              "webView.getViewTreeObserver().addOnPreDrawListener("
          )

          if start != -1:
              end = s.find(
                  "                      );",
                  start
              )

              if end != -1:
                  end += len("                      );")
                  s = s[:start] + s[end:]

          # Start 5-second timer immediately after splash is shown
          if "startupHandler.postDelayed" not in s:
              s = s.replace(
                  "showStartupIcon();",
                  """showStartupIcon();

                  // Keep splash visible for a full 5 seconds.
                  startupHandler.postDelayed(
                      hideStartupRunnable,
                      STARTUP_SPLASH_DURATION
                  );""",
                  1
              )

          # 120dp -> 240dp
          s = s.replace(
              "(int) (120 * getResources().getDisplayMetrics().density)",
              "(int) (240 * getResources().getDisplayMetrics().density)"
          )

          # Cancel timer when Activity is destroyed
          if "startupHandler.removeCallbacks" not in s:
              marker = "\n          }\n      }"
              pos = s.rfind(marker)

              if pos != -1:
                  s = s[:pos] + """
              @Override
              protected void onDestroy() {
                  startupHandler.removeCallbacks(hideStartupRunnable);
                  super.onDestroy();
              }
          }""" + s[pos + len(marker):]

          f.write_text(s)

          print("5-second large startup splash configured.")
          PY

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Create Capacitor assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OK-CRICK.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: OK CRICK APK ${{ github.run_number }}
          files: OK-CRICK.apk
          generate_release_notes: false
