name: Build OK CRICK APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install Python Pillow for Icon Generation
        run: pip install Pillow

      - name: Configure Android Manifest, Theme Background, and UI Features
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Add swiperefreshlayout dependency to build.gradle
          build_gradle = Path("android/app/build.gradle")
          if build_gradle.exists():
              content = build_gradle.read_text()
              if "swiperefreshlayout" not in content:
                  if "dependencies {" in content:
                      content = content.replace(
                          "dependencies {",
                          "dependencies {\n    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'"
                      )
                      build_gradle.write_text(content)
                      print("Added swiperefreshlayout dependency to build.gradle")

          # 2. Update AndroidManifest.xml for App Installation & Notification Icons
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              manifest_content = manifest_path.read_text()
              if "android:icon" not in manifest_content:
                  manifest_content = manifest_content.replace(
                      "<application",
                      '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"'
                  )
              if "com.google.firebase.messaging.default_notification_icon" not in manifest_content:
                  meta_tag = '\n        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/startup_icon" />'
                  
                  manifest_content = manifest_content.replace(
                      "</application>",
                      f"{meta_tag}\n    </application>"
                  )
              manifest_path.write_text(manifest_content)
              print("Updated AndroidManifest.xml with launcher and notification icons")

          # 3. Copy the repository icon to a guaranteed drawable resource for startup overlay & instant background.
          drawable_dir = Path("android/app/src/main/res/drawable")
          drawable_dir.mkdir(parents=True, exist_ok=True)
          source_icon = Path("resources/icon.png")
          target_icon = drawable_dir / "startup_icon.png"
          if not source_icon.exists():
              raise SystemExit("ERROR: resources/icon.png was not found")
          target_icon.write_bytes(source_icon.read_bytes())
          print(f"Copied startup icon: {source_icon} -> {target_icon}")

          # 4. Do NOT use startup_icon as windowBackground.
# The startup icon will be shown only by MainActivity's overlay.
# This prevents the initial full-screen icon from appearing before the overlay.
values_dir = Path("android/app/src/main/res/values")

for theme_file in ["styles.xml", "themes.xml"]:
    theme_path = values_dir / theme_file

    if theme_path.exists():
        t_content = theme_path.read_text()

        # Remove any previously added startup_icon windowBackground.
        t_content = t_content.replace(
            '<item name="android:windowBackground">@drawable/startup_icon</item>',
            ''
        )

        theme_path.write_text(t_content)
        print(f"Removed startup_icon windowBackground from {theme_file}")

          # 5. Update MainActivity (Java or Kotlin) with 5-second persistent startup icon overlay & existing logic
          java_files = list(
              Path("android/app/src/main/java").rglob("MainActivity.java")
          )

          kt_files = list(
              Path("android/app/src/main/java").rglob("MainActivity.kt")
          )

          if java_files:
              java_file = java_files[0]
              java_file.write_text("""package in.okcrick.app;

          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import androidx.activity.OnBackPressedCallback;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private View startupOverlay;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  showStartupIcon();

                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          hideStartupIcon();
                      }
                  }, 5000);

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              if (getBridge() != null &&
                                  getBridge().getWebView() != null &&
                                  getBridge().getWebView().canGoBack()) {
                                  getBridge().getWebView().goBack();
                              } else {
                                  new AlertDialog.Builder(MainActivity.this)
                                      .setTitle("Exit App")
                                      .setMessage("Are you sure you want to exit?")
                                      .setNegativeButton("NO", null)
                                      .setPositiveButton("YES", (dialog, which) -> finish())
                                      .show();
                              }
                          }
                      }
                  );

                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      ViewGroup parent = (ViewGroup) webView.getParent();
                      if (parent != null) {
                          parent.removeView(webView);

                          SwipeRefreshLayout swipeRefreshLayout = new SwipeRefreshLayout(this);
                          swipeRefreshLayout.setLayoutParams(new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          ));

                          swipeRefreshLayout.addView(webView, new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          ));

                          swipeRefreshLayout.setOnRefreshListener(() -> {
                              webView.reload();
                              new Handler(Looper.getMainLooper()).postDelayed(() -> {
                                  swipeRefreshLayout.setRefreshing(false);
                              }, 1200);
                          });

                          parent.addView(swipeRefreshLayout);
                      }
                  }
              }

              private void showStartupIcon() {
                  ViewGroup root = findViewById(android.R.id.content);
                  if (root == null) return;

                  FrameLayout overlay = new FrameLayout(this);
                  overlay.setBackgroundColor(Color.WHITE);
                  overlay.setLayoutParams(new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  ImageView icon = new ImageView(this);
                  icon.setImageResource(getResources().getIdentifier(
                      "startup_icon", "drawable", getPackageName()
                  ));
                  icon.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  int size = (int) (240 * getResources().getDisplayMetrics().density);
                  FrameLayout.LayoutParams iconParams = new FrameLayout.LayoutParams(size, size);
                  iconParams.gravity = Gravity.CENTER;
                  overlay.addView(icon, iconParams);

                  root.addView(overlay);
                  startupOverlay = overlay;
              }

              private void hideStartupIcon() {
                  View overlay = startupOverlay;
                  if (overlay == null) return;
                  startupOverlay = null;
                  overlay.animate()
                      .alpha(0f)
                      .setDuration(300)
                      .withEndAction(() -> {
                          ViewGroup parent = (ViewGroup) overlay.getParent();
                          if (parent != null) parent.removeView(overlay);
                      })
                      .start();
              }
          }
          """)
              print(f"Updated Java MainActivity: {java_file}")

          elif kt_files:
              kt_file = kt_files[0]
              kt_file.write_text("""package in.okcrick.app

          import android.app.AlertDialog
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.ImageView
          import androidx.activity.OnBackPressedCallback
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {

              private var startupOverlay: View? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  showStartupIcon()

                  Handler(Looper.getMainLooper()).postDelayed({
                      hideStartupIcon()
                  }, 5000)

                  onBackPressedDispatcher.addCallback(
                      this,
                      object : OnBackPressedCallback(true) {
                          override fun handleOnBackPressed() {
                              val webView = bridge?.webView
                              if (webView != null && webView.canGoBack()) {
                                  webView.goBack()
                              } else {
                                  AlertDialog.Builder(this@MainActivity)
                                      .setTitle("Exit App")
                                      .setMessage("Are you sure you want to exit?")
                                      .setNegativeButton("NO", null)
                                      .setPositiveButton("YES") { _, _ -> finish() }
                                      .show()
                              }
                          }
                      }
                  )

                  val webView = bridge?.webView
                  if (webView != null) {
                      val parent = webView.parent as? ViewGroup
                      parent?.let {
                          it.removeView(webView)
                          val swipeRefreshLayout = SwipeRefreshLayout(this).apply {
                              layoutParams = ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                              addView(webView, ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              ))
                              setOnRefreshListener {
                                  webView.reload()
                                  Handler(Looper.getMainLooper()).postDelayed({
                                      isRefreshing = false
                                  }, 1200)
                              }
                          }
                          it.addView(swipeRefreshLayout)
                      }
                  }
              }

              private void showStartupIcon() {
                  val root = findViewById<ViewGroup>(android.R.id.content) ?: return

                  val overlay = FrameLayout(this)
                  overlay.setBackgroundColor(Color.WHITE)
                  overlay.layoutParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  )

                  val icon = ImageView(this)
                  icon.setImageResource(resources.getIdentifier(
                      "startup_icon", "drawable", packageName
                  ))
                  icon.scaleType = ImageView.ScaleType.FIT_CENTER

                  val size = (120 * resources.displayMetrics.density).toInt()
                  val iconParams = FrameLayout.LayoutParams(size, size)
                  iconParams.gravity = Gravity.CENTER
                  overlay.addView(icon, iconParams)

                  root.addView(overlay);
                  startupOverlay = overlay
              }

              private void hideStartupIcon() {
                  val overlay = startupOverlay ?: return
                  startupOverlay = null
                  overlay.animate()
                      .alpha(0f)
                      .setDuration(300)
                      .withEndAction {
                          (overlay.parent as? ViewGroup)?.removeView(overlay)
                      }
                      .start()
              }
          }
          """)
              print(f"Updated Kotlin MainActivity: {kt_file}")

          else:
              raise SystemExit("ERROR: MainActivity.java or MainActivity.kt was not found")
          PY

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Fix Mipmap PNG icons for Notifications and Installers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_icon = Path("resources/icon.png")
          if source_icon.exists():
              img = Image.open(source_icon).convert("RGBA")
              mipmaps = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192
              }
              res_dir = Path("android/app/src/main/res")
              for folder, size in mipmaps.items():
                  target_folder = res_dir / folder
                  target_folder.mkdir(parents=True, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(target_folder / "ic_launcher.png", "PNG")
                  resized.save(target_folder / "ic_launcher_round.png", "PNG")
              print("Injected standard PNG icons into mipmap folders over capacitor-assets output!")
          PY

      - name: Create Capacitor assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OK-CRICK.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: OK CRICK APK ${{ github.run_number }}
          files: OK-CRICK.apk
          generate_release_notes: false
