name: Build OK CRICK APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android exit confirmation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java_files = list(
              Path("android/app/src/main/java").rglob("MainActivity.java")
          )

          kt_files = list(
              Path("android/app/src/main/java").rglob("MainActivity.kt")
          )

          if java_files:
              java_file = java_files[0]

              java_file.write_text("""package in.okcrick.app;

          import android.app.AlertDialog;
          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {

                          @Override
                          public void handleOnBackPressed() {

                              if (getBridge() != null &&
                                  getBridge().getWebView() != null &&
                                  getBridge().getWebView().canGoBack()) {

                                  getBridge().getWebView().goBack();

                              } else {

                                  new AlertDialog.Builder(MainActivity.this)
                                      .setTitle("Exit App")
                                      .setMessage("Are you sure you want to exit?")
                                      .setNegativeButton("NO", null)
                                      .setPositiveButton(
                                          "YES",
                                          (dialog, which) -> finish()
                                      )
                                      .show();
                              }
                          }
                      }
                  );
              }
          }
          """)

              print(f"Updated Java MainActivity: {java_file}")

          elif kt_files:
              kt_file = kt_files[0]

              kt_file.write_text("""package in.okcrick.app

          import android.app.AlertDialog
          import android.os.Bundle
          import androidx.activity.OnBackPressedCallback
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  onBackPressedDispatcher.addCallback(
                      this,
                      object : OnBackPressedCallback(true) {

                          override fun handleOnBackPressed() {

                              val webView = bridge?.webView

                              if (webView != null && webView.canGoBack()) {

                                  webView.goBack()

                              } else {

                                  AlertDialog.Builder(this@MainActivity)
                                      .setTitle("Exit App")
                                      .setMessage("Are you sure you want to exit?")
                                      .setNegativeButton("NO", null)
                                      .setPositiveButton("YES") { _, _ ->
                                          finish()
                                      }
                                      .show()
                              }
                          }
                      }
                  )
              }
          }
          """)

              print(f"Updated Kotlin MainActivity: {kt_file}")

          else:
              raise SystemExit(
                  "ERROR: MainActivity.java or MainActivity.kt was not found"
              )
          PY

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Create Capacitor assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OK-CRICK.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: OK CRICK APK ${{ github.run_number }}
          files: OK-CRICK.apk
          generate_release_notes: false
