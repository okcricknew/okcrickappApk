name: Build OK CRICK APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Pull-to-Refresh dependency
          gradle = Path("android/app/build.gradle")
          s = gradle.read_text()

          if "swiperefreshlayout" not in s:
              s = s.replace(
                  "dependencies {",
                  "dependencies {\n    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'",
                  1
              )
              gradle.write_text(s)

          # Startup icon
          icon = Path("resources/icon.png")

          if not icon.exists():
              raise SystemExit("resources/icon.png not found")

          drawable = Path(
              "android/app/src/main/res/drawable-nodpi"
          )
          drawable.mkdir(
              parents=True,
              exist_ok=True
          )

          (drawable / "startup_icon.png").write_bytes(
              icon.read_bytes()
          )

          # Native startup background
          bg = Path(
              "android/app/src/main/res/drawable/startup_background.xml"
          )

          bg.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white"/>
              <item
                  android:gravity="center"
                  android:width="240dp"
                  android:height="240dp">
                  <bitmap
                      android:src="@drawable/startup_icon"
                      android:gravity="fill"/>
              </item>
          </layer-list>
          """)

          # MainActivity
          java = list(
              Path("android/app/src/main/java")
              .rglob("MainActivity.java")
          )

          if not java:
              raise SystemExit("MainActivity.java not found")

          f = java[0]
          s = f.read_text()

          # Imports
          s = s.replace(
              "import android.os.Bundle;",
              "import android.os.Bundle;\nimport android.os.Handler;"
          )

          # Splash variables
          s = s.replace(
              "private View startupOverlay;",
              """private View startupOverlay;

              private static final long SPLASH_TIME = 5000L;

              private final Handler splashHandler = new Handler();

              private final Runnable hideSplash =
                  () -> hideStartupIcon();"""
          )

          # Native window background
          s = s.replace(
              "super.onCreate(savedInstanceState);",
              """getWindow().setBackgroundDrawableResource(
                      getResources().getIdentifier(
                          "startup_background",
                          "drawable",
                          getPackageName()
                      )
                  );

                  super.onCreate(savedInstanceState);""",
              1
          )

          # Start splash timer
          s = s.replace(
              "showStartupIcon();",
              """showStartupIcon();

                  splashHandler.postDelayed(
                      hideSplash,
                      SPLASH_TIME
                  );""",
              1
          )

          # Remove old WebView first-draw hide code
          start = s.find(
              "webView.getViewTreeObserver().addOnPreDrawListener("
          )

          if start != -1:
              end = s.find(
                  "                      );",
                  start
              )

              if end != -1:
                  s = s[:start] + s[end + len("                      );"):]

          # Keep splash ABOVE WebView
          s = s.replace(
              "parent.addView(swipeRefreshLayout);",
              """parent.addView(swipeRefreshLayout);

                          if (startupOverlay != null) {
                              startupOverlay.bringToFront();
                          }""",
              1
          )

          # Large icon: 240dp
          s = s.replace(
              "(int) (120 * getResources().getDisplayMetrics().density)",
              "(int) (240 * getResources().getDisplayMetrics().density)"
          )

          # Cleanup timer
          s = s.replace(
              "\n          }\n      }\n",
              """
              @Override
              protected void onDestroy() {
                  splashHandler.removeCallbacks(hideSplash);
                  super.onDestroy();
              }
          }
      }
          """,
              1
          )

          f.write_text(s)

          print("OK CRICK 5-second splash configured.")

          PY

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Create Capacitor assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OK-CRICK.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: OK CRICK APK ${{ github.run_number }}
          files: OK-CRICK.apk
          generate_release_notes: false
