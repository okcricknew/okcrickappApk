name: Generate OK CRICK Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore okcrick-release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=OK CRICK, OU=OK CRICK, O=OK CRICK, L=India, ST=India, C=IN"

      - name: Encode keystore
        run: base64 -w 0 okcrick-release.jks > okcrick-release.base64

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: OK-CRICK-KEYSTORE
          path: |
            okcrick-release.jks
            okcrick-release.base64
